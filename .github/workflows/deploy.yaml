name: Deploy Infrastructure and Hugo Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TERRAFORM_VERSION: latest
  HUGO_VERSION: latest
  AWS_REGION: 'us-east-1'

jobs:
  check-terraform-changes:
    name: Check Terraform Changes
    runs-on: ubuntu-latest
    outputs:
      terraform_changed: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for terraform changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: check-terraform-changes
    if: needs.check-terraform-changes.outputs.terraform_changed == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
        working-directory: ./terraform

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

      - name: Get Terraform Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tf_output
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        working-directory: ./terraform

  deploy-hugo:
    name: Build and Deploy Hugo Site
    runs-on: ubuntu-latest
    needs: [check-terraform-changes, terraform]
    if: |
      always() && 
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo site
        run: hugo --minify
        working-directory: ./site/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Get S3 bucket name from Terraform output or environment variable
          if [ -n "${{ needs.terraform.outputs.s3_bucket }}" ]; then
            echo "Got S3 bucket value from terraform"
            BUCKET="${{ needs.terraform.outputs.s3_bucket }}"
          else
            echo "Got S3 bucket value from environment variable"
            BUCKET="${{ secrets.S3_BUCKET }}"
          fi
          
          aws s3 sync ./site/public/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache (if applicable)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          echo ".CLOUDFRONT_DISTRIBUTION_ID found. Invalidating ache"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
